<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="q4.css">
</head>
<body>

<header>
    <h1>CSS Selectors Practice</h1>
</header>

<main>
    <p>This is an element selector.</p>

    <p class="special">This paragraph uses a class selector.</p>

    <p id="unique">This paragraph uses an ID selector.</p>

    <a href="https://example.com">Normal Link</a>
    <a href="#" target="_blank">Target Link</a>

    <ul>
        <li>First Item</li>
        <li>Second Item</li>
    </ul>

    <div>
        <p>Paragraph inside div.</p>
        <span>Text inside div.</span>
    </div>

    <p>Paragraph after div.</p>
    <p>Another paragraph.</p>
</main>

<footer>
    <p>CSS Selectors Practice</p>
</footer>

</body>
</html>
