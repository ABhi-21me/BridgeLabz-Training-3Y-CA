<!DOCTYPE html>
<html>
<head>
    <title>Box Sizing</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

<h1>Box-Sizing Comparison</h1>

<main class="boxes">

    <div class="box normal">
        <h2>Default</h2>
        <p>Width does not include padding and border.</p>
    </div>

    <div class="box border">
        <h2>Border Box</h2>
        <p>Width includes padding and border.</p>
    </div>

</main>

</body>
</html>
