<!DOCTYPE html>
<html>
<head>
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

<header>
    <h1>Pseudo-Class Examples</h1>
</header>

<main>
    <div class="examples">

        <section>
            <a href="#">Hover Link</a>
            <p>:hover changes the link when the mouse is over it.</p>
        </section>

        <section>
            <button>Focus Button</button>
            <p>:focus changes the button when it is selected.</p>
        </section>

        <section>
            <button class="active-btn">Active Button</button>
            <p>:active works while the button is being clicked.</p>
        </section>

        <section>
            <ul>
                <li>First Item</li>
                <li>Second Item</li>
                <li>Third Item</li>
            </ul>
            <p>:nth-child() selects an item by its position.</p>
        </section>

    </div>
</main>

<footer>
    <p>CSS Practice</p>
</footer>

</body>
</html>
