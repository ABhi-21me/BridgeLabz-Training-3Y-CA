<!DOCTYPE html>
<html>
<head>
  <title>Custom Dropdown</title>
  <style>
    body{font-family:Arial;margin:30px}.options{display:none;width:150px;border:1px solid #aaa}
    .options div{padding:9px;cursor:pointer}.options div:hover{background:#eee}
  </style>
</head>
<body>
  <h2>Custom Dropdown</h2>
  <button id="drop">Choose an option</button>
  <div class="options" id="options">
    <div>JavaScript</div><div>HTML</div><div>CSS</div>
  </div>
  <script src="Q8.js"></script>
</body>
</html>
