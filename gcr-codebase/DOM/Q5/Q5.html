<!DOCTYPE html>
<html>
<head>
  <title>Image Gallery</title>
  <style>
    body{font-family:Arial;margin:25px}.gallery{display:grid;grid-template-columns:repeat(3,130px);gap:12px}
    .gallery img{width:130px;height:100px;object-fit:cover;cursor:pointer}
    #modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center}
    #box{background:white;padding:12px}#big{max-width:80vw;max-height:80vh}
  </style>
</head>
<body>
  <h2>Image Gallery</h2>
  <div class="gallery" id="gallery">
    <img src="https://picsum.photos/id/1015/300/200" alt="Image 1">
    <img src="https://picsum.photos/id/1016/300/200" alt="Image 2">
    <img src="https://picsum.photos/id/1025/300/200" alt="Image 3">
    <img src="https://picsum.photos/id/1035/300/200" alt="Image 4">
    <img src="https://picsum.photos/id/1043/300/200" alt="Image 5">
    <img src="https://picsum.photos/id/1062/300/200" alt="Image 6">
  </div>
  <div id="modal"><div id="box"><img id="big" src="" alt="Preview"></div></div>
  <script src="Q5.js"></script>
</body>
</html>
