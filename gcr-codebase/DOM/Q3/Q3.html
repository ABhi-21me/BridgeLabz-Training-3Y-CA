<!DOCTYPE html>
<html>
<head>
  <title>Multi Step Form</title>
  <style>
    body{font-family:Arial;margin:30px}.step{display:none}.step.active{display:block}
    input{display:block;margin:10px 0;padding:7px}
  </style>
</head>
<body>
  <h2>Three Step Form</h2>
  <form id="form">
    <div class="step active">
      <label>Name</label><input id="name" required>
    </div>
    <div class="step">
      <label>Email</label><input id="email" type="email" required>
    </div>
    <div class="step">
      <label>Password</label><input id="password" type="password" minlength="6" required>
    </div>
    <button type="button" id="back">Back</button>
    <button type="button" id="next">Next</button>
  </form>
  <p id="result"></p>
  <script src="Q3.js"></script>
</body>
</html>
