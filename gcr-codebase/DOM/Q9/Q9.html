<!DOCTYPE html>
<html>
<head>
  <title>Form Submit Blocker</title>
  <style>
    body{font-family:Arial;margin:30px}input{display:block;margin:6px 0 3px;padding:7px}
    .error{color:red;font-size:14px;min-height:17px}
  </style>
</head>
<body>
  <h2>Form Validation</h2>
  <form id="form" novalidate>
    <label>Name</label><input id="name">
    <div class="error" id="nameErr"></div>
    <label>Email</label><input id="email">
    <div class="error" id="emailErr"></div>
    <label>Password</label><input id="password" type="password">
    <div class="error" id="passErr"></div>
    <button type="submit">Submit</button>
  </form>
  <p id="success"></p>
  <script src="Q9.js"></script>
</body>
</html>
