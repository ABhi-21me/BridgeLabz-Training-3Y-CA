<!DOCTYPE html>
<html>
<head>
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

<header>
    <h1>Image Filter Gallery</h1>
</header>

<main class="gallery">

    <section class="item">
        <img class="blur" src="https://picsum.photos/id/1015/400/300" alt="Mountain">
        <p>Blur</p>
    </section>

    <section class="item">
        <img class="gray" src="https://picsum.photos/id/1011/400/300" alt="Nature">
        <p>Grayscale</p>
    </section>

    <section class="item">
        <img class="sepia" src="https://picsum.photos/id/1025/400/300" alt="Dog">
        <p>Sepia</p>
    </section>

    <section class="item">
        <img class="bright" src="https://picsum.photos/id/1035/400/300" alt="Water">
        <p>Brightness</p>
    </section>

    <section class="item">
        <img class="contrast" src="https://picsum.photos/id/1043/400/300" alt="Forest">
        <p>Contrast</p>
    </section>

    <section class="item">
        <img class="hue" src="https://picsum.photos/id/1050/400/300" alt="Beach">
        <p>Hue Rotate</p>
    </section>

</main>

</body>
</html>
