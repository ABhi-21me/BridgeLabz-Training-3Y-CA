<!DOCTYPE html>
<html>
<head>
    <title>CSS Cheat Sheet</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>

<h1>Responsive CSS Cheat Sheet</h1>

<main class="sheet">

    <section>
        <h2>Filters</h2>
        <p>filter: grayscale(100%);</p>
    </section>

    <section>
        <h2>Media Queries</h2>
        <p>@media (max-width: 700px)</p>
    </section>

    <section>
        <h2>Responsive Design</h2>
        <p>Design that adjusts to different screen sizes.</p>
    </section>

    <section>
        <h2>Typography</h2>
        <p>font-size: clamp(1rem, 2vw, 1.5rem);</p>
    </section>

</main>

</body>
</html>
