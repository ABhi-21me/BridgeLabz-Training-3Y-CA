<!DOCTYPE html>
<html>
<head>
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

<header>
    <h1>CSS Selectors</h1>
</header>

<main>
    <section>
        <h2>Items</h2>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>Python</li>
        </ul>

        <input type="text" placeholder="Enter name">

        <p>
            Visit <a href="https://example.com">Example</a>
        </p>

        <div class="box">
            <p>This is inside the box.</p>
            <span>This is also inside.</span>
        </div>
    </section>
</main>

</body>
</html>
