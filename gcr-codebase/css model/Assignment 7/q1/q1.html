<!DOCTYPE html>
<html>
<head>
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

<header>
    <h1>Borders and Padding</h1>
</header>

<main>
    <section class="boxes">
        <div class="box solid">Solid Border</div>
        <div class="box dashed">Dashed Border</div>
        <div class="box double">Double Border</div>
        <div class="box groove">Groove Border</div>
    </section>

    <section class="rounded">
        <div class="box round1">Padding 10px</div>
        <div class="box round2">Padding 20px</div>
        <div class="box round3">Padding 30px</div>
    </section>
</main>

</body>
</html>
