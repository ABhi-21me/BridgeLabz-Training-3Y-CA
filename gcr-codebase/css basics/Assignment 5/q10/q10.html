<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Complete Website</title>
    <link rel="stylesheet" href="q10.css">
</head>

<body>
    <header>
        <h2>My Website</h2>
        <nav> <a href="#home">Home</a> <a href="#about">About</a> <a href="#services">Services</a> <a
                href="#contact">Contact</a> </nav>
    </header>
    <section class="hero" id="home">
        <div class="welcome">
            <h1>Welcome to My Website</h1>
            <p>Learn, explore and create something new.</p>
        </div>
    </section>
    <section class="about" id="about">
        <div class="about-text">
            <h2>About Us</h2>
            <p>We create simple and useful websites using HTML and CSS.</p>
        </div> <img src="about.jpg" alt="About Image">
    </section>
    <section class="services" id="services">
        <div class="service">Web Design</div>
        <div class="service">Development</div>
        <div class="service">Support</div>
    </section>
    <section class="contact" id="contact">
        <h2>Contact Us</h2>
        <form> <input type="text" placeholder="Your Name"> <input type="email" placeholder="Your Email"> <textarea
                placeholder="Message"></textarea> <button>Send</button> </form>
    </section>
    <div class="help">?</div>
    <footer>
        <p>© 2026 My Website. All rights reserved.</p>
    </footer>
</body>

</html>
