<!DOCTYPE html>
<html>
<head>
    <title>Update User</title>
    <style>
        body { font-family: Arial; max-width: 420px; margin: 30px auto; }
        input { display: block; width: 100%; box-sizing: border-box; padding: 8px; margin: 6px 0 12px; }
    </style>
</head>
<body>
    <h2>Edit User</h2>
    <form id="userForm">
        <label>Name</label><input id="name">
        <label>Email</label><input id="email" type="email">
        <label>Age</label><input id="age" type="number">
        <button type="submit">Update</button>
    </form>
    <h3>Updated user</h3>
    <pre id="details"></pre>
    <script src="q8.js"></script>
</body>
</html>
