<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <style>
        body { font-family: Arial; max-width: 420px; margin: 30px auto; }
        input { display: block; width: 100%; box-sizing: border-box; padding: 8px; margin: 6px 0 12px; }
        #msg { margin-top: 12px; }
    </style>
</head>
<body>
    <h2>Student Registration</h2>
    <form id="form">
        <label>Name</label><input id="name" type="text">
        <label>Email</label><input id="email" type="text">
        <label>Phone</label><input id="phone" type="text">
        <label>Password</label><input id="pass" type="password">
        <button type="submit">Register</button>
    </form>
    <p id="msg"></p>
    <script src="q2.js"></script>
</body>
</html>
