<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q10.css">
</head>
<body>
<header class="text-center p-4">
    <h1>Travel Explorer</h1>
    <p class="lead">Discover your next destination</p>
</header>
<main>
    <section id="travel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="3000">
                <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=1200"
                     class="d-block w-100" alt="Paris">
                <div class="carousel-caption">
                    <h2>Paris</h2><p>Explore the city of lights.</p>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="4000">
                <img src="https://images.unsplash.com/photo-1530789253388-582c481c54b0?w=1200"
                     class="d-block w-100" alt="Beach">
                <div class="carousel-caption">
                    <h2>Maldives</h2><p>Relax beside beautiful blue waters.</p>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="5000">
                <img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=1200"
                     class="d-block w-100" alt="Bali">
                <div class="carousel-caption">
                    <h2>Bali</h2><p>Experience nature and adventure.</p>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#travel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#travel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </section>
    <section class="container my-5">
        <h3>Booking Completion</h3>
        <div class="progress" role="progressbar">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 70%;">70%</div>
        </div>
    </section>
</main>
<footer class="bg-dark text-white text-center p-4">
    <p>Contact: travel@example.com | +91 98765 43210</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
