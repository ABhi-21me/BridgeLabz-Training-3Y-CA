<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q2.css">
</head>
<body class="bg-light text-dark">
<header class="text-center mt-4">
    <h1 class="fw-bold">Abhi Vishwakarma</h1>
    <p>Computer Science Student & Developer</p>
</header>
<main class="container text-center p-5">
    <section>
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400"
             class="img-fluid rounded-circle profile" alt="Profile">
        <h2 class="mt-4">Hello, I'm Abhi</h2>
        <p>I enjoy coding, cloud computing and building useful applications.</p>
        <button class="btn btn-primary me-2">Hire Me</button>
        <button class="btn btn-outline-dark">Download CV</button>
    </section>
    <section class="mt-4">
        <h3>Contact Me</h3>
        <form class="mx-auto contact-form">
            <input type="text" class="form-control mb-3" placeholder="Your Name">
            <input type="email" class="form-control mb-3" placeholder="Your Email">
            <textarea class="form-control mb-3" rows="3" placeholder="Your Message"></textarea>
            <button class="btn btn-dark">Send Message</button>
        </form>
    </section>
</main>
</body>
</html>
