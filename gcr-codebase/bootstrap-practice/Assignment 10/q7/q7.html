<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q7.css">
</head>
<body>
<main class="container my-5">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h1>My Tasks</h1>
        <span class="badge bg-danger">4 Pending</span>
    </header>
    <div class="list-group">
        <div class="list-group-item d-flex justify-content-between align-items-center">
            Complete Assignment <span class="badge bg-danger">High</span>
        </div>
        <div class="list-group-item d-flex justify-content-between align-items-center">
            Study Bootstrap <span class="badge bg-warning text-dark">Medium</span>
        </div>
        <div class="list-group-item d-flex justify-content-between align-items-center">
            Read Notes <span class="badge bg-success">Low</span>
        </div>
        <div class="list-group-item d-flex justify-content-between align-items-center">
            Push Code to GitHub <span class="badge bg-danger">High</span>
        </div>
    </div>
    <button class="btn btn-success mt-4">
        Completed <span class="badge bg-light text-dark">3</span>
    </button>
</main>
</body>
</html>
