<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q6.css">
</head>
<body>
<main class="container my-5">
    <div class="card p-4">
        <h1 class="mb-4">Notifications</h1>
        <div class="alert alert-success">New message received successfully.</div>
        <div class="alert alert-info">Tip: Complete your profile to get better recommendations.</div>
        <div class="alert alert-danger">Warning: Your password will expire soon.</div>
        <div class="alert alert-warning alert-dismissible fade show">
            You have a pending account verification.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <section class="summary p-4 bg-light border">
            <h3>Summary</h3>
            <p>You have 4 new notifications and 2 pending actions.</p>
        </section>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
