<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q3.css">
</head>
<body>
<header class="text-center p-4">
    <h1>Product Catalog</h1>
    <p>Find products you love</p>
</header>
<main class="container">
    <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" class="card-img-top" alt="Shoes">
                <div class="card-body">
                    <h5>Running Shoes</h5>
                    <p>₹2,999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" class="card-img-top" alt="Watch">
                <div class="card-body">
                    <h5>Smart Watch</h5>
                    <p>₹4,499</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" class="card-img-top" alt="Headphones">
                <div class="card-body">
                    <h5>Headphones</h5>
                    <p>₹1,999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product">
                <img src="https://images.unsplash.com/photo-1544816155-12df9643f363?w=500" class="card-img-top" alt="Bag">
                <div class="card-body">
                    <h5>Travel Bag</h5>
                    <p>₹2,499</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
