<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q8.css">
</head>
<body>
<main class="container my-5">
    <h1 class="text-center mb-5">Choose Your Plan</h1>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card h-100 shadow">
                <div class="card-body text-center">
                    <h2>Basic</h2><h3>₹199/month</h3>
                    <ul class="list-unstyled my-4">
                        <li>5 Projects</li><li>5 GB Storage</li><li>Email Support</li>
                    </ul>
                    <button class="btn btn-outline-primary">Choose Plan</button>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow-lg bg-primary text-white pro">
                <div class="card-body text-center">
                    <h2>Pro</h2><h3>₹499/month</h3>
                    <ul class="list-unstyled my-4">
                        <li>Unlimited Projects</li><li>50 GB Storage</li><li>Priority Support</li>
                    </ul>
                    <button class="btn btn-light">Choose Plan</button>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow">
                <div class="card-body text-center">
                    <h2>Business</h2><h3>₹999/month</h3>
                    <ul class="list-unstyled my-4">
                        <li>Unlimited Projects</li><li>200 GB Storage</li><li>24/7 Support</li>
                    </ul>
                    <button class="btn btn-outline-primary">Choose Plan</button>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
