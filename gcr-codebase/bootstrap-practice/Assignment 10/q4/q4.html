<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q4.css">
</head>
<body>
<header class="text-center p-4">
    <h1>Spice Garden</h1>
    <p class="lead">Today's Menu</p>
</header>
<main class="container">
    <section class="row">
        <div class="col-md-8">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr><th>Item</th><th>Category</th><th>Price</th></tr>
                </thead>
                <tbody>
                    <tr><td>Paneer Tikka</td><td>Starter</td><td>₹220</td></tr>
                    <tr><td>Butter Paneer</td><td>Main Course</td><td>₹280</td></tr>
                    <tr><td>Veg Biryani</td><td>Main Course</td><td>₹240</td></tr>
                    <tr><td>Gulab Jamun</td><td>Dessert</td><td>₹100</td></tr>
                </tbody>
            </table>
        </div>
        <div class="col-md-4">
            <h3>Chef's Specials</h3>
            <ul class="list-group">
                <li class="list-group-item">Special Thali</li>
                <li class="list-group-item">Tandoori Paneer</li>
                <li class="list-group-item">Masala Dosa</li>
            </ul>
        </div>
    </section>
    <section class="text-center mt-4">
        <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800"
             class="img-fluid food-img" alt="Food">
        <p class="mt-2">Freshly prepared food served with love.</p>
    </section>
</main>
<footer class="text-center p-3 mt-4 bg-dark text-white">
    © 2026 Spice Garden
</footer>
</body>
</html>
