<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTalk Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q5.css">
</head>
<body>
<header class="p-4">
    <div class="container d-flex justify-content-between align-items-center">
        <h1>TechTalk</h1>
        <button class="btn btn-primary">Subscribe</button>
    </div>
</header>
<main class="container my-5">
    <div class="row g-4">
        <div class="col-md-6">
            <article class="card">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=700"
                     class="card-img-top" alt="Technology">
                <div class="card-body">
                    <h2 class="card-title">The Future of Technology</h2>
                    <p class="card-text">Explore how modern technology is changing our everyday lives.</p>
                    <button class="btn btn-primary">Read More</button>
                </div>
            </article>
        </div>
        <div class="col-md-6">
            <article class="card">
                <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=700"
                     class="card-img-top" alt="Cloud">
                <div class="card-body">
                    <h2 class="card-title">Getting Started with Cloud</h2>
                    <p class="card-text">A simple introduction to cloud computing and its benefits.</p>
                    <button class="btn btn-primary">Read More</button>
                </div>
            </article>
        </div>
    </div>
</main>
<footer class="text-center p-4">
    <p>© 2026 TechTalk Blog</p>
</footer>
</body>
</html>
