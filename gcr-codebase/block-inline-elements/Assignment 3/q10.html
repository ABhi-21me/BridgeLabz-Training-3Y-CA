<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>
<body>

<h1>Travel Details</h1>

<form>

    <label>Country:</label>

    <select>
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
        <option>Australia</option>
    </select>

    <br><br>

    <label>State:</label>

    <select>
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Goa</option>
        <option>Maharashtra</option>
    </select>

    <br><br>

    <label>City:</label>

    <select>
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Jaipur</option>
        <option>Lucknow</option>
    </select>

    <br><br>

    <label>Favorite Tourist Place:</label>

    <select>
        <option selected>Taj Mahal</option>
        <option>Goa Beach</option>
        <option>Hawa Mahal</option>
        <option>India Gate</option>
    </select>

</form>

<p>
    I selected India, Uttar Pradesh, Mathura and Taj Mahal
    as my travel choices.
</p>

</body>
</html>
